<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="profile-container">
      <div id="profile-image">
        <img src="./assets/images/Zubin_Nair_Profile.png" alt="zubin-nair" />
      </div>
      <div id="social-details">
        <h2>Zubin Nair</h2>
        <p>Berlin, Germany</p>
      </div>
      <blockquote id="about-me-summary">
        "Front-end developer and avid reader."
      </blockquote>
      <div id="social-links">
        <a class="social-link" href="https://github.com/znair96"> GitHub </a>
        <a
          class="social-link"
          href="https://www.frontendmentor.io/profile/znair96"
        >
          Frontend Mentor
        </a>
        <a class="social-link" href="https://www.linkedin.com/in/zubin-nair/">
          LinkedIn
        </a>
        <a class="social-link" href="https://www.youtube.com/@zubinnair8233"
          >Youtube</a
        >
        <a class="social-link" href="https://www.instagram.com/znair96">
          Instagram
        </a>
      </div>
    </div>
  </body>
</html>
